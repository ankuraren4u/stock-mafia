version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: stockmafia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-stockmafia}
      MYSQL_USER: ${DB_USER:-stockmafia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stockmafia}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockmafia

  redis:
    image: redis:7-alpine
    container_name: stockmafia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockmafia

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stockmafia-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - stockmafia

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stockmafia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - stockmafia

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: stockmafia-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    networks:
      - stockmafia

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: stockmafia-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - stockmafia

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: stockmafia-logstash
    volumes:
      - ./elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch
    networks:
      - stockmafia

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: stockmafia-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - stockmafia

  nginx:
    image: nginx:alpine
    container_name: stockmafia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway
    networks:
      - stockmafia

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    container_name: stockmafia-gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - CRAWLER_GRPC_ADDR=crawler:9001
      - PRICE_GRPC_ADDR=price:9002
      - ANALYTICS_GRPC_ADDR=analytics:9003
      - ALERT_GRPC_ADDR=alert:9004
      - PORTFOLIO_GRPC_ADDR=portfolio:9005
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET:-secret}
    depends_on:
      - redis
      - crawler
      - price
      - analytics
      - alert
      - portfolio
    networks:
      - stockmafia

  crawler:
    build:
      context: ../services/crawler
      dockerfile: Dockerfile
    container_name: stockmafia-crawler
    ports:
      - "9001:9001"
    environment:
      - CRAWLER_GRPC_PORT=9001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-stockmafia}
      - DB_PASSWORD=${DB_PASSWORD:-stockmafia}
      - DB_NAME=${DB_NAME:-stockmafia}
      - REDIS_ADDR=redis:6379
    depends_on:
      - mysql
      - redis
    networks:
      - stockmafia

  price:
    build:
      context: ../services/price
      dockerfile: Dockerfile
    container_name: stockmafia-price
    ports:
      - "9002:9002"
      - "8082:8082"
    environment:
      - PRICE_GRPC_PORT=9002
      - PRICE_HTTP_PORT=8082
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - stockmafia

  analytics:
    build:
      context: ../services/analytics
      dockerfile: Dockerfile
    container_name: stockmafia-analytics
    ports:
      - "9003:9003"
    environment:
      - ANALYTICS_GRPC_PORT=9003
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - stockmafia

  alert:
    build:
      context: ../services/alert
      dockerfile: Dockerfile
    container_name: stockmafia-alert
    ports:
      - "9004:9004"
    environment:
      - ALERT_GRPC_PORT=9004
      - REDIS_ADDR=redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      - redis
    networks:
      - stockmafia

  portfolio:
    build:
      context: ../services/portfolio
      dockerfile: Dockerfile
    container_name: stockmafia-portfolio
    ports:
      - "9005:9005"
    environment:
      - PORTFOLIO_GRPC_PORT=9005
      - REDIS_ADDR=redis:6379
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
    depends_on:
      - redis
    networks:
      - stockmafia

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  stockmafia:
    driver: bridge
