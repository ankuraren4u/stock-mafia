apiVersion: apps/v1
kind: Deployment
metadata:
  name: price
  namespace: stockmafia
  labels:
    app: price
spec:
  replicas: 2
  selector:
    matchLabels:
      app: price
  template:
    metadata:
      labels:
        app: price
    spec:
      containers:
        - name: price
          image: stockmafia/price:latest
          ports:
            - containerPort: 9002
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: stockmafia-config
            - secretRef:
                name: stockmafia-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 9002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: price
  namespace: stockmafia
spec:
  selector:
    app: price
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP
