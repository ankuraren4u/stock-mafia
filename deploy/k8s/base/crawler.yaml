apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler
  namespace: stockmafia
  labels:
    app: crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler
  template:
    metadata:
      labels:
        app: crawler
    spec:
      containers:
        - name: crawler
          image: stockmafia/crawler:latest
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: stockmafia-config
            - secretRef:
                name: stockmafia-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: crawler
  namespace: stockmafia
spec:
  selector:
    app: crawler
  ports:
    - port: 9001
      targetPort: 9001
  type: ClusterIP
