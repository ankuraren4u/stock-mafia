apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert
  namespace: stockmafia
  labels:
    app: alert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert
  template:
    metadata:
      labels:
        app: alert
    spec:
      containers:
        - name: alert
          image: stockmafia/alert:latest
          ports:
            - containerPort: 9004
          envFrom:
            - configMapRef:
                name: stockmafia-config
            - secretRef:
                name: stockmafia-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 9004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alert
  namespace: stockmafia
spec:
  selector:
    app: alert
  ports:
    - port: 9004
      targetPort: 9004
  type: ClusterIP
