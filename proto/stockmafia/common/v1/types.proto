syntax = "proto3";

package stockmafia.common.v1;

option go_package = "github.com/stockmafia/trading-app/proto/stockmafia/common/v1;commonv1";

message Stock {
  string symbol = 1;
  string name = 2;
  string exchange = 3;
  string sector = 4;
  string industry = 5;
  bool is_active = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message Quote {
  string symbol = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double last = 6;
  double change = 7;
  double change_percent = 8;
  int64 volume = 9;
  double bid = 10;
  double ask = 11;
  int64 timestamp = 12;
  string source = 13;
  double previous_close = 14;
  string currency = 15;
}

message Candle {
  string symbol = 1;
  string interval = 2;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
  int64 volume = 7;
  int64 timestamp = 8;
}

message Indicator {
  string name = 1;
  double value = 2;
  double signal = 3;
  string status = 4;
  map<string, double> params = 5;
}

message Signal {
  string symbol = 1;
  string strategy = 2;
  string direction = 3;
  double strength = 4;
  double confidence = 5;
  repeated Indicator indicators = 6;
  string message = 7;
  int64 timestamp = 8;
}

message Alert {
  string id = 1;
  string user_id = 2;
  string symbol = 3;
  string alert_type = 4;
  string condition = 5;
  double target_value = 6;
  bool is_active = 7;
  string channel = 8;
  int64 created_at = 9;
  int64 triggered_at = 10;
}

message Position {
  string id = 1;
  string user_id = 2;
  string symbol = 3;
  string side = 4;
  double quantity = 5;
  double entry_price = 6;
  double current_price = 7;
  double pnl = 8;
  double pnl_percent = 9;
  string status = 10;
  int64 created_at = 11;
}

message Order {
  string id = 1;
  string user_id = 2;
  string symbol = 3;
  string side = 4;
  string order_type = 5;
  double quantity = 6;
  double price = 7;
  double trigger_price = 8;
  string status = 9;
  string exchange_order_id = 10;
  int64 created_at = 11;
}

message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool sort_desc = 4;
}

message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_pages = 4;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message HealthCheck {
  string service = 1;
  string status = 2;
  string version = 3;
  int64 timestamp = 4;
  map<string, string> metadata = 5;
}

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  TIMEFRAME_1M = 1;
  TIMEFRAME_5M = 2;
  TIMEFRAME_15M = 3;
  TIMEFRAME_30M = 4;
  TIMEFRAME_1H = 5;
  TIMEFRAME_1D = 6;
  TIMEFRAME_1W = 7;
  TIMEFRAME_1MTH = 8;
}

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_NSE = 1;
  EXCHANGE_BSE = 2;
  EXCHANGE_NYSE = 3;
  EXCHANGE_NASDAQ = 4;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_SLM = 3;
  ORDER_TYPE_SL = 4;
}
