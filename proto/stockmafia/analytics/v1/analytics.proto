syntax = "proto3";

package stockmafia.analytics.v1;

import "common/v1/types.proto";

option go_package = "github.com/stockmafia/trading-app/proto/stockmafia/analytics/v1;analyticsv1";

service AnalyticsService {
  rpc GetSignals(GetSignalsRequest) returns (GetSignalsResponse);
  rpc GetAlgoConfig(GetAlgoConfigRequest) returns (GetAlgoConfigResponse);
  rpc GenerateSuggestions(GenerateSuggestionsRequest) returns (GenerateSuggestionsResponse);
  rpc ExecuteSuggestion(ExecuteSuggestionRequest) returns (ExecuteSuggestionResponse);
  rpc RunScreener(RunScreenerRequest) returns (RunScreenerResponse);
  rpc GetStrategies(GetStrategiesRequest) returns (GetStrategiesResponse);
  rpc RunStrategy(RunStrategyRequest) returns (RunStrategyResponse);
}

message GetSignalsRequest {
  string symbol = 1;
}

message GetSignalsResponse {
  repeated stockmafia.common.v1.Signal signals = 1;
}

message GetAlgoConfigRequest {
}

message GetAlgoConfigResponse {
  map<string, string> config = 1;
}

message GenerateSuggestionsRequest {
}

message GenerateSuggestionsResponse {
  repeated Suggestion suggestions = 1;
}

message Suggestion {
  int64 id = 1;
  string symbol = 2;
  string direction = 3;
  double confidence = 4;
  string strategy = 5;
  string message = 6;
}

message ExecuteSuggestionRequest {
  int64 suggestion_id = 1;
  string mode = 2;
}

message ExecuteSuggestionResponse {
  bool success = 1;
  string message = 2;
}

message RunScreenerRequest {
  map<string, string> filters = 1;
  string sort_by = 2;
  bool sort_desc = 3;
  int32 limit = 4;
}

message RunScreenerResponse {
  repeated ScreenerResult results = 1;
  int32 total_count = 2;
}

message ScreenerResult {
  string symbol = 1;
  string name = 2;
  double score = 3;
  repeated stockmafia.common.v1.Indicator indicators = 4;
  string signal = 5;
}

message GetStrategiesRequest {
  bool active_only = 1;
}

message GetStrategiesResponse {
  repeated Strategy strategies = 1;
}

message Strategy {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_active = 4;
  map<string, string> parameters = 5;
  double win_rate = 6;
  int32 total_trades = 7;
}

message RunStrategyRequest {
  string strategy_id = 1;
  string symbol = 2;
  string interval = 3;
  int32 lookback = 4;
}

message RunStrategyResponse {
  string strategy_id = 1;
  string symbol = 2;
  string signal = 3;
  double confidence = 4;
  repeated stockmafia.common.v1.Signal signals = 5;
  map<string, double> metrics = 6;
}
